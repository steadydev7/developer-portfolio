<!doctype html>

    <!-- Basic Meta Tags -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Noah Thomas" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Noah Thomas" />
    <meta
      name="description"
      content="Noah Thomas — Senior AI Software Engineer with 7+ years building production-ready AI systems: Generative AI, LLMs, RAG and agentic workflows, with Python backends and React/Next.js front ends."
    />

      name="keywords"
      content="Noah Thomas, AI software engineer, AI engineer, generative AI, LLM engineer, RAG, LangChain, agentic workflows, Python, FastAPI, React, Next.js, full stack developer, portfolio"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1E1E2F" />
    <meta name="referrer" content="origin-when-cross-origin" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="googlebot" content="index, follow" />
    <meta name="revisit-after" content="7 days" />

    <!--
      Content-Security-Policy. GitHub Pages serves static files only, so this
      meta tag is the sole delivery mechanism available (no custom HTTP
      headers). Note that per the CSP spec, frame-ancestors, report-uri, and
      sandbox are silently ignored when set via <meta> — they require a real
      response header, which GitHub Pages cannot provide for this repo.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' https://www.googletagmanager.com https://*.firebaseio.com https://*.firebasedatabase.app;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' data:;
        connect-src 'self' https://api.github.com https://github-contributions-api.jogruber.de https://api.emailjs.com https://www.google-analytics.com https://*.google-analytics.com https://www.google.com https://analytics.google.com https://stats.g.doubleclick.net https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app;
        frame-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- DNS Prefetching -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com/" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com/" />
    <link rel="dns-prefetch" href="https://www.google.com/" />
    <link rel="dns-prefetch" href="https://www.linkedin.com/" />
    <link rel="dns-prefetch" href="https://www.github.com/" />

    <!-- Preconnect -->
    <link
      rel="preconnect"
      href="https://www.googletagmanager.com/"
      crossorigin="anonymous"
    />
    <link
      rel="preconnect"
      href="https://www.google-analytics.com/"
      crossorigin="anonymous"
    />
    <link
      rel="preconnect"
      href="https://www.google.com/"
      crossorigin="anonymous"
    />

    <!-- Microsoft Tile Tags -->
    <meta name="msapplication-TileColor" content="#1E1E2F" />
    <meta name="msapplication-TileImage" content="/mstile-144x144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="application-name" content="Noah Thomas" />

    <!-- Apple Web App Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="HandheldFriendly" content="True" />

    <!-- Open Graph Meta Tags -->

    />
    <meta property="og:image:width" content="1200" />
